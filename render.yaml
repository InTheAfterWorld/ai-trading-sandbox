# Render Blueprint — the single deployment config for this repo.
# Deploy with the "Deploy to Render" button in the README, or via
# Dashboard -> New -> Blueprint with this repo. Spec reference:
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-trading-sandbox
    runtime: python
    plan: free
    # Python version is pinned by the .python-version file at the repo root
    # ("3.12" resolves to the latest 3.12.x patch release on Render).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # One worker: simulation state lives in the web process memory.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --access-logfile - ai_trading_society.web.render_app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Never return stored trader API keys to a browser. Defense in depth:
      # ai_trading_society/web/render_app.py also forces this on import.
      - key: ATS_REDACT_CONFIG
        value: "1"
      # Stable Flask session secret (auto-generated on first deploy) so
      # browser sessions survive instance restarts mid-simulation.
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Optional: comma-separated extra origins allowed to call the API
      # cross-origin. Leave unset — the dashboard is same-origin.
      - key: ATS_CORS_ORIGINS
        sync: false

